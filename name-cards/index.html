<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centred column, a segmented switch on top, one big photo card in the middle, two thumb-reach buttons below. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --ink: #15212c;
  --muted: #5d6b79;
  --line: #d5dce3;
  --accent: #1d6c8a;
  --accent-ink: #ffffff;
  --good: #1f7a4d;
  --good-bg: #dff3e8;
  --bad: #b4400f;
  --bad-bg: #fbe5da;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820; --surface: #19242e; --ink: #e8eef3; --muted: #93a2b0; --line: #2b3a47;
    --accent: #5db8d8; --accent-ink: #08212c; --good: #5fcf94; --good-bg: #153b29; --bad: #f08a5d; --bad-bg: #44230f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820; --surface: #19242e; --ink: #e8eef3; --muted: #93a2b0; --line: #2b3a47;
  --accent: #5db8d8; --accent-ink: #08212c; --good: #5fcf94; --good-bg: #153b29; --bad: #f08a5d; --bad-bg: #44230f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stage { display: flex; flex-direction: column; gap: 14px; }
.photo { width: 100%; aspect-ratio: 1; border-radius: 22px; object-fit: cover; background: var(--line); display: block; }
.card { border: 0; padding: 0; background: none; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.nameplate { min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
.nameplate .name { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; text-wrap: balance; }
.nameplate .hint { color: var(--muted); font-size: 15px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--bad-bg); color: var(--bad); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 15px 12px; border-radius: 14px; font-weight: 600; font-size: 17px; }
.btn.miss { color: var(--bad); }
.btn.got { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.wide { grid-column: 1 / -1; }
.btn[disabled] { opacity: .4; cursor: default; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { border: 2px solid var(--line); background: var(--surface); padding: 16px 10px; border-radius: 14px; font-weight: 600; font-size: 18px; }
.choice.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choice.no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; }
.item img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; display: block; }
.item input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 10px; font-size: 17px; font-weight: 600; }
.lvl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 8px; align-self: center; }
.status { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 0; }
.sec h2 { margin: 0; font-family: var(--font-display); font-size: 19px; }
.sec span { color: var(--muted); font-size: 14px; }
.item { grid-template-columns: 56px 1fr auto; }
.nm { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
.item.flag { border-color: var(--bad); border-width: 2px; }
.mv { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.done { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px 20px; display: flex; flex-direction: column; gap: 14px; }
.done h2 { margin: 0; font-family: var(--font-display); font-size: 26px; }
.flash { color: var(--good); font-weight: 600; text-align: center; min-height: 20px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>Name Cards</h1><span class="count" id="count"></span></div>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button role="tab" id="t-learn" aria-selected="true" data-mode="learn">Cards</button>
    <button role="tab" id="t-quiz" aria-selected="false" data-mode="quiz">Quiz</button>
    <button role="tab" id="t-names" aria-selected="false" data-mode="names">Names</button>
  </div>
  <div class="status" id="status"></div>
  <main class="stage" id="stage"></main>
</div>

const KEY = 'namecards-v2';
const byId = Object.fromEntries(DECK.map(c => [c.id, c]));
// known: ids in the Known list. queue: people still to see this round. round: round number.
let st = { names: {}, known: [], queue: [], round: 1 };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.names && Array.isArray(s.known)) st = Object.assign(st, s); } catch (e) {}
st.known = st.known.filter(id => byId[id]);
st.queue = st.queue.filter(id => byId[id] && !st.known.includes(id));
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const nameOf = c => (st.names[c.id] || c.name || '').trim();
const label = c => nameOf(c) || 'No name yet';
const isKnown = id => st.known.includes(id);
const learning = () => DECK.filter(c => !isKnown(c.id));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newRound(first) {
  st.queue = shuffle(learning().map(c => c.id));
  if (!first) st.round++;
  save();
}
if (!st.queue.length && learning().length) newRound(true);

let mode = 'learn', revealed = false, answered = false, opts = [], optsFor = null, flash = '';
const current = () => st.queue.length ? byId[st.queue[0]] : null;
function grade(ok) {
  const id = st.queue.shift();
  if (ok) { st.known.push(id); flash = label(byId[id]) + ' moved to Known'; }
  else flash = '';
  if (!st.queue.length && learning().length) { newRound(false); flash = 'Round ' + st.round + ': ' + st.queue.length + ' left to learn'; }
  save(); revealed = false; optsFor = null; status(); render();
}
function status() {
  const k = st.known.length, n = DECK.length;
  document.getElementById('count').textContent = k + ' of ' + n + ' known';
  document.getElementById('barfill').style.width = (k / n * 100) + '%';
  const L = learning().length;
  document.getElementById('status').innerHTML = L
    ? '<span>Round <b>' + st.round + '</b></span><span>·</span><span><b>' + st.queue.length + '</b> left this round</span><span>·</span><span><b>' + L + '</b> learning</span>'
    : '';
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const stage = document.getElementById('stage');
function mixBack() { st.known = []; st.round = 1; newRound(true); flash = 'Everyone is back in Learning'; status(); render(); }

function doneView() {
  stage.innerHTML = '<div class="done"><h2>You know all ' + DECK.length + '</h2><p class="note">Mix everyone back in for a full review round.</p><button class="btn got" id="mix">Mix all back in</button></div>';
  document.getElementById('mix').onclick = mixBack;
}
function nameBlock(c) {
  return '<span class="name">' + esc(label(c)) + '</span>' +
    (!nameOf(c) ? '<span class="chip">Add the name in the Names tab</span>' : c.unsure ? '<span class="chip">Check this tag</span>' : '');
}
function renderLearn() {
  const c = current(); if (!c) return doneView();
  stage.innerHTML =
    '<div class="flash">' + esc(flash) + '</div>' +
    '<button class="card" id="flip" aria-label="Show name">' +
      '<img class="photo" src="' + c.img + '" alt="Photo to identify">' +
      '<div class="nameplate">' + (revealed ? nameBlock(c) : '<span class="hint">Tap to show the name</span>') + '</div>' +
    '</button>' +
    '<div class="row">' + (revealed
      ? '<button class="btn miss" id="miss">Missed it</button><button class="btn got" id="got">Knew it</button>'
      : '<button class="btn wide" id="show">Show name</button>') + '</div>';
  const reveal = () => { revealed = true; flash = ''; renderLearn(); };
  document.getElementById('flip').onclick = () => { if (!revealed) reveal(); };
  if (!revealed) document.getElementById('show').onclick = reveal;
  else { document.getElementById('miss').onclick = () => grade(false); document.getElementById('got').onclick = () => grade(true); }
}
function renderQuiz() {
  const c = current(); if (!c) return doneView();
  if (optsFor !== c.id) {
    const pool = shuffle(DECK.filter(o => o.id !== c.id && nameOf(o) && nameOf(o) !== nameOf(c)));
    opts = shuffle(pool.slice(0, 3).concat(c)); optsFor = c.id;
  }
  stage.innerHTML =
    '<div class="flash">' + esc(flash) + '</div>' +
    '<img class="photo" src="' + c.img + '" alt="Photo to identify">' +
    '<div class="choices">' + opts.map((o, i) => '<button class="choice" data-i="' + i + '">' + esc(label(o)) + '</button>').join('') + '</div>' +
    '<div class="row"><button class="btn wide" id="nxt" disabled>Next</button></div>';
  answered = false; let wasOk = false;
  const btns = [...stage.querySelectorAll('.choice')];
  btns.forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    wasOk = opts[+b.dataset.i].id === c.id;
    btns.forEach((x, i) => { if (opts[i].id === c.id) x.classList.add('ok'); });
    if (!wasOk) b.classList.add('no');
    const n = document.getElementById('nxt'); n.disabled = false; n.focus();
  });
  document.getElementById('nxt').onclick = () => grade(wasOk);
}
function itemRow(c, known) {
  const flag = !nameOf(c) || (c.unsure && !st.names[c.id]);
  return '<div class="item' + (flag ? ' flag' : '') + '"><img src="' + c.img + '" alt="">' +
    '<div class="nm"><input id="n-' + c.id + '" data-id="' + c.id + '" value="' + esc(nameOf(c)) + '" placeholder="Add name" aria-label="Name" autocomplete="off">' +
    (!nameOf(c) ? '<span class="chip">Write the name</span>' : (c.unsure && !st.names[c.id]) ? '<span class="chip">Tag unclear, check spelling</span>' : '') + '</div>' +
    '<button class="mv" data-id="' + c.id + '">' + (known ? 'Back to learning' : 'I know this') + '</button></div>';
}
function renderNames() {
  const L = learning(), K = DECK.filter(c => isKnown(c.id));
  stage.innerHTML =
    '<p class="note">Edit names here; they save in this browser.' + (() => { const n = DECK.filter(c => !nameOf(c) || (c.unsure && !st.names[c.id])).length; return n ? ' <b style="color:var(--bad)">' + n + ' need your attention</b> (red outline).' : ''; })() + '</p>' +
    '<div class="sec"><h2>Learning</h2><span>' + L.length + '</span></div>' +
    '<div class="list">' + (L.map(c => itemRow(c, false)).join('') || '<p class="note">Nobody left to learn.</p>') + '</div>' +
    '<div class="sec"><h2>Known</h2><span>' + K.length + '</span></div>' +
    '<div class="list">' + (K.map(c => itemRow(c, true)).join('') || '<p class="note">Names you get right move here.</p>') + '</div>' +
    (K.length ? '<button class="btn" id="mix">Mix all back in</button>' : '');
  stage.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const v = inp.value.trim(); if (v) st.names[inp.dataset.id] = v; else delete st.names[inp.dataset.id];
    save(); renderNames();
  });
  stage.querySelectorAll('.mv').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (isKnown(id)) { st.known = st.known.filter(x => x !== id); st.queue.push(id); }
    else { st.known.push(id); st.queue = st.queue.filter(x => x !== id); if (!st.queue.length && learning().length) newRound(false); }
    save(); status(); renderNames();
  });
  const m = document.getElementById('mix'); if (m) m.onclick = mixBack;
}
function render() { if (mode === 'learn') renderLearn(); else if (mode === 'quiz') renderQuiz(); else renderNames(); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; revealed = false; flash = '';
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  render();
});
document.addEventListener('keydown', e => {
  if (mode !== 'learn' || e.target.tagName === 'INPUT' || !current()) return;
  if (!revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); revealed = true; flash = ''; renderLearn(); }
  else if (revealed && (e.key === 'ArrowLeft' || e.key === '1')) grade(false);
  else if (revealed && (e.key === 'ArrowRight' || e.key === '2')) grade(true);
});
status(); render();
</script>
