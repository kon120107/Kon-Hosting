# Builds the KonMap Android app and publishes the APK as a GitHub release.
# Runs only when the app itself changes (android/ or this file): map data updates
# reach the app by themselves and need no new build.
name: KonMap Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/konmap-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        env:
          KONMAP_KEYSTORE: ${{ github.workspace }}/android/konmap.jks
          KONMAP_KEYSTORE_PASSWORD: kNjPNSoqGAPxVtV6zhSUIDZ
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk "KonMap-$N.apk"
          gh release create "konmap-app-$N" "KonMap-$N.apk" \
            --target "${{ github.sha }}" --title "KonMap app $N" --latest \
            --notes "Install KonMap-$N.apk on your phone. Map data updates by itself; a new app build is only needed when the app changes."
