<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KonMap</title>
<style>
:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--bg:#fbfbfa}
@media (prefers-color-scheme:dark){:root{--fg:#ececec;--muted:#9a9a9f;--line:#3a3a3c;--bg:#161617}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 18px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 18px}
a.city{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:17px}
a.city small{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
</style></head><body><main>
<h1>KonMap</h1><p>Pick a city.</p><div id="list"></div>
</main><script>
// Launcher. index.html opens the default city (cities/index.json "default"); #all lists the cities; index.html#turin loads the engine that cities/index.json names for Turin
// and writes it into this page (artifact viewers can't pass query strings or open sub-pages reliably).
(function(){
  var list=document.getElementById('list');
  // Put the engine page into this one: its styles and body, then its scripts in order (external first, awaited).
  function mount(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title;
    document.head.innerHTML=doc.head.innerHTML;
    var scripts=[].slice.call(doc.body.querySelectorAll('script')); scripts.forEach(function(x){ x.remove(); });
    document.body.innerHTML=doc.body.innerHTML;
    (function next(i){
      if(i>=scripts.length) return;
      var x=document.createElement('script');
      if(scripts[i].src){ x.src=scripts[i].src; x.onload=function(){ next(i+1); }; x.onerror=function(){ document.body.insertAdjacentHTML('afterbegin','<p style="padding:16px">Could not load '+x.src+'</p>'); }; document.body.appendChild(x); }
      else { x.textContent=scripts[i].textContent; document.body.appendChild(x); next(i+1); }
    })(0);
  }
  window.addEventListener('hashchange',function(){ location.reload(); });
  fetch('cities/index.json').then(function(r){ return r.json(); }).then(function(d){
    var want=(location.hash||'').replace(/^#/,'')||d['default']||'';
    var hit=d.cities.filter(function(c){ return c.id===want; })[0];
    if(hit){
      return fetch('engines/'+hit.engine+'/index.html').then(function(r){ if(!r.ok) throw new Error('engine '+r.status); return r.text(); })
        .then(function(html){ window.KONMAP_CITY=hit.id; mount(html); });
    }
    d.cities.forEach(function(c){
      var a=document.createElement('a'); a.className='city'; a.href='#'+c.id;
      a.textContent=c.name; list.appendChild(a);
    });
  }).catch(function(e){ list.textContent='Could not load: '+e.message; });
})();
</script></body></html>
