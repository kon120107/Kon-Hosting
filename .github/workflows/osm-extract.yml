# One-off helper: cuts a city box out of a Geofabrik country extract and commits it to this branch
# (the Claude sandbox cannot reach OSM servers). Edit CITY/BOX/REGION and push to run.
name: OSM extract
on:
  push:
    paths: ['.github/workflows/osm-extract.yml']
permissions:
  contents: write
env:
  CITY: plovdiv
  REGION: europe/bulgaria
  BOX: 24.60,42.09,24.86,42.19
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: |
          curl -sSfL -o country.pbf "https://download.geofabrik.de/$REGION-latest.osm.pbf"
          osmium extract -b "$BOX" country.pbf -o "konmap/raw/$CITY.osm.pbf" --overwrite
          ls -la konmap/raw/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "konmap/raw/$CITY.osm.pbf"
          git commit -m "OSM extract for $CITY ($BOX) from Geofabrik"
          git push
